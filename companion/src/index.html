<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Life Journal Companion</title>
    <!-- Thematic Fonts (Asynchronous for instant window render) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="app-container">
      <header>
        <div class="logo-container">
          <img src="assets/logo.png" alt="MLJ Logo" class="app-logo" />
        </div>
        <h1>MLJ Companion</h1>
        <p>In-Game Adventure Synced Live</p>
      </header>

      <!-- Settings Panel -->
      <section class="settings-panel">
        <div class="form-group">
          <label for="api-key-input">Journal API Key</label>
          <div class="input-row">
            <input
              id="api-key-input"
              type="password"
              placeholder="Paste your key: mlj_..."
            />
            <button id="validate-btn">Connect</button>
          </div>
        </div>

        <div class="form-group">
          <label for="mc-path-input">Minecraft Folder Path</label>
          <input
            id="mc-path-input"
            type="text"
            placeholder="C:\Users\username\AppData\Roaming\.minecraft"
          />
        </div>

        <div class="form-group">
          <label for="world-select">Active World Mapping</label>
          <select id="world-select" disabled>
            <option value="">-- Connect API Key First --</option>
          </select>
        </div>

        <div class="tray-option-row">
          <label class="tray-option-label" for="tray-checkbox">
            <input id="tray-checkbox" type="checkbox" checked />
            <span class="checkbox-custom"></span>
            <span class="tray-option-text">Minimize to System Tray on Close (X)</span>
          </label>
        </div>

        <div class="input-row action-buttons">
          <button id="start-btn" class="btn-primary-action" disabled>
            Start Monitoring
          </button>
          <button id="stop-btn" class="btn-secondary" disabled>
            Stop
          </button>
        </div>
      </section>

      <!-- Connection Status Bar -->
      <section class="status-bar">
        <div class="status-indicator">
          <div id="status-dot" class="status-dot"></div>
          <span id="status-text" class="status-text">Disconnected</span>
        </div>
        <div id="mc-status-text" class="mc-status">Minecraft: Closed</div>
      </section>

      <!-- Console Logs Logger -->
      <section class="console-panel">
        <div class="console-header">
          <div class="console-header-left">
            <span class="console-title">Sync Console Log</span>
            <span id="log-count" class="log-count-badge">1 entry</span>
          </div>
          <div class="console-header-actions">
            <button id="bug-report-btn" class="btn-bug">🐛 Report Bug</button>
            <button id="clear-logs-btn" class="btn-clear">Clear Log</button>
          </div>
        </div>
        <div id="console-logs" class="console-logs">
          <div class="log-entry info">Companion app initialized. Paste your API Key and folder path to start.</div>
        </div>
      </section>
    </div>

    <!-- Bug Report Modal -->
    <div id="bug-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>🐛 Report a Bug</h2>
          <button id="close-bug-modal" class="btn-close-modal">&times;</button>
        </div>
        <p class="modal-desc">Send a bug report directly to the developer's Discord.</p>
        
        <div class="form-group">
          <label for="bug-title-input">Issue Title *</label>
          <input id="bug-title-input" type="text" placeholder="Brief summary of the issue" />
        </div>

        <div class="form-group">
          <label for="bug-desc-input">Description & Steps to Reproduce *</label>
          <textarea id="bug-desc-input" rows="4" placeholder="What happened? What were you doing when the bug occurred?"></textarea>
        </div>

        <div class="form-group">
          <label for="bug-contact-input">Your Contact / Discord (Optional)</label>
          <input id="bug-contact-input" type="text" placeholder="e.g. Steve#1234 or email@domain.com" />
        </div>

        <div id="bug-status-msg" class="bug-status hidden"></div>

        <div class="modal-actions">
          <button id="cancel-bug-btn" class="btn-secondary">Cancel</button>
          <button id="submit-bug-btn" class="btn-primary-action">Submit Report</button>
        </div>
      </div>
    </div>
  </body>
</html>
