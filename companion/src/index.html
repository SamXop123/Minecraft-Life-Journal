<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Life Journal Companion</title>
    <!-- Thematic Retro Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="app-container">
      <header>
        <div class="logo-container">
          <img src="assets/logo.png" alt="MLJ Logo" class="app-logo" />
        </div>
        <h1>MLJ Companion</h1>
        <p>In-Game Adventure Synced Live</p>
      </header>

      <!-- Settings Panel -->
      <section class="settings-panel">
        <div class="form-group">
          <label for="api-key-input">Journal API Key</label>
          <div class="input-row">
            <input
              id="api-key-input"
              type="password"
              placeholder="Paste your key: mlj_..."
            />
            <button id="validate-btn">Connect</button>
          </div>
        </div>

        <div class="form-group">
          <label for="mc-path-input">Minecraft Folder Path</label>
          <input
            id="mc-path-input"
            type="text"
            placeholder="C:\Users\username\AppData\Roaming\.minecraft"
          />
        </div>

        <div class="form-group">
          <label for="world-select">Active World Mapping</label>
          <select id="world-select" disabled>
            <option value="">-- Connect API Key First --</option>
          </select>
        </div>

        <div class="input-row" style="margin-top: 4px;">
          <button id="start-btn" class="btn-primary-action" style="flex: 1;" disabled>
            Start Monitoring
          </button>
          <button id="stop-btn" class="btn-secondary" style="flex: 1;" disabled>
            Stop
          </button>
        </div>
      </section>

      <!-- Connection Status Bar -->
      <section class="status-bar">
        <div class="status-indicator">
          <div id="status-dot" class="status-dot"></div>
          <span id="status-text" class="status-text" style="color: #ef4444;">Disconnected</span>
        </div>
        <div id="mc-status-text" class="mc-status">Minecraft: Closed</div>
      </section>

      <!-- Console Logs Logger -->
      <section class="console-panel">
        <div class="console-header">Sync Console Log</div>
        <div id="console-logs" class="console-logs">
          <div class="log-entry info">Companion app initialized. Paste your API Key and folder path to start.</div>
        </div>
      </section>
    </div>
  </body>
</html>
